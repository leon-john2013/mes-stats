<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes stats Course & Vélo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1720; --card:#17222e; --card2:#1e2b39; --line:#2a3a4b;
    --txt:#eef3f8; --muted:#8ea2b6;
    --run:#ff6b3d; --bike:#2ec4b6; --gold:#ffc93c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:15px}
  .wrap{max-width:980px;margin:0 auto;padding:24px 18px 60px}
  h1,h2,h3,.big{font-family:"Bricolage Grotesque",Inter,sans-serif}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
  h1{font-size:34px;margin:0;line-height:1.05;font-weight:800}
  h1 .r{color:var(--run)} h1 .b{color:var(--bike)}
  .sub{color:var(--muted);margin-top:6px}
  .tabs{display:flex;background:var(--card);border-radius:999px;padding:4px;gap:2px}
  .tabs button{border:0;background:none;color:var(--muted);padding:8px 14px;border-radius:999px;font:600 14px Inter;cursor:pointer}
  .tabs button.on{background:var(--card2);color:var(--txt)}
  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  @media (max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)} h1{font-size:28px}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .kpi .lab{color:var(--muted);font-size:13px}
  .kpi .big{font-size:30px;font-weight:800;margin-top:4px}
  .kpi .big small{font-size:15px;color:var(--muted);font-weight:500;margin-left:3px}
  .two{grid-template-columns:1.1fr .9fr;margin-top:14px}
  @media (max-width:820px){.two{grid-template-columns:1fr}}
  h2{font-size:19px;margin:0 0 12px}
  form .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1;min-width:90px}
  input,textarea{background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 10px;font:15px Inter;width:100%}
  input:focus,textarea:focus{outline:2px solid var(--bike);border-color:transparent}
  .sport{display:flex;gap:8px;margin-bottom:12px}
  .sport button{flex:1;border:2px solid var(--line);background:var(--bg);color:var(--txt);border-radius:12px;padding:12px;font:700 16px "Bricolage Grotesque";cursor:pointer}
  .sport button.on.run{border-color:var(--run);background:rgba(255,107,61,.12)}
  .sport button.on.bike{border-color:var(--bike);background:rgba(46,196,182,.12)}
  .dur{display:flex;gap:6px}
  .dur input{text-align:center}
  .go{width:100%;border:0;border-radius:12px;padding:13px;font:800 16px "Bricolage Grotesque";background:var(--gold);color:#1a1a1a;cursor:pointer;margin-top:4px}
  .go:hover{filter:brightness(1.05)}
  .import{display:block;text-align:center;border:2px dashed var(--bike);border-radius:12px;padding:12px;margin-bottom:12px;color:var(--txt);font:700 15px "Bricolage Grotesque";cursor:pointer;flex:none}
  .import:hover{background:rgba(46,196,182,.08)}
  .import input{display:none}
  .msg{min-height:20px;font-size:13px;margin-top:8px;color:var(--gold)}
  .chart svg{width:100%;height:auto;display:block}
  .legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:6px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .records{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .rec{background:var(--card2);border-radius:12px;padding:10px 12px}
  .rec .lab{font-size:12px;color:var(--muted)} .rec .v{font-weight:700;margin-top:2px}
  .badges{display:flex;flex-wrap:wrap;gap:8px}
  .badge{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:999px;padding:7px 12px 7px 8px;font-size:13px;opacity:.35}
  .badge.got{opacity:1;box-shadow:0 0 0 1px var(--gold) inset}
  .badge .e{font-size:18px}
  table{width:100%;border-collapse:collapse}
  td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
  th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .pill.run{background:rgba(255,107,61,.15);color:var(--run)}
  .pill.bike{background:rgba(46,196,182,.15);color:var(--bike)}
  .del{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 9px;cursor:pointer;font-size:12px}
  .del.sure{border-color:var(--run);color:var(--run)}
  .empty{color:var(--muted);text-align:center;padding:26px 0}
  .note{color:var(--muted);font-size:12px}
  .save{font-size:12px;color:var(--muted)}
  @media (max-width:560px){ .hide-s{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Mes stats <span class="r">Course</span> &amp; <span class="b">Vélo</span></h1>
      <div class="sub">Note tes sorties, regarde tes progrès 💪 <span class="save" id="saveState"></span></div>
    </div>
    <div class="tabs" id="tabs">
      <button data-f="all" class="on">Tout</button>
      <button data-f="run">🏃 Course</button>
      <button data-f="bike">🚴 Vélo</button>
    </div>
  </header>

  <div class="grid kpis" id="kpis"></div>

  <div class="grid two">
    <div class="card">
      <h2>Ajouter une sortie</h2>
      <form id="f">
        <div class="sport">
          <button type="button" class="run on" data-s="run">🏃 Course</button>
          <button type="button" class="bike" data-s="bike">🚴 Vélo</button>
        </div>
        <label class="import" for="gpx">📂 Importer ma sortie (fichier GPX)<input type="file" id="gpx" accept=".gpx,application/gpx+xml,application/xml,text/xml"></label>
        <div class="row">
          <label>Date<input type="date" id="date" required></label>
          <label>Distance (km)<input type="number" id="dist" min="0.1" step="0.01" placeholder="5" required></label>
        </div>
        <div class="row">
          <label>Durée (heures · minutes · secondes)
            <div class="dur">
              <input type="number" id="hh" min="0" placeholder="h">
              <input type="number" id="mm" min="0" max="59" placeholder="min">
              <input type="number" id="ss" min="0" max="59" placeholder="s">
            </div>
          </label>
        </div>
        <div class="row">
          <label>Petit commentaire (facultatif)<input type="text" id="note" maxlength="80" placeholder="Avec papa, il pleuvait…"></label>
        </div>
        <button class="go" type="submit">Enregistrer ma sortie ✓</button>
        <div class="msg" id="msg"></div>
      </form>
    </div>

    <div class="card chart">
      <h2>Mes km des 8 dernières semaines</h2>
      <div id="chart"></div>
      <div class="legend"><span><i class="dot" style="background:var(--run)"></i>Course</span><span><i class="dot" style="background:var(--bike)"></i>Vélo</span></div>
      <div class="records" id="records"></div>
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <h2>Mes badges 🏅</h2>
    <div class="badges" id="badges"></div>
  </div>

  <div class="card" style="margin-top:14px">
    <h2>Toutes mes sorties</h2>
    <div id="list"></div>
  </div>
</div>

<script id="app-data" type="application/json">[]</script>
<script>
(function(){
  // Capture the pristine document before anything is rendered into it.
  const SOURCE = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;

  let sessions = [];
  try { sessions = JSON.parse(document.getElementById("app-data").textContent) || []; } catch(e){ sessions = []; }

  let filter = "all", sport = "run", artifactApi = null, pendingDel = null;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // ---------- saving ----------
  const LS = "sport-stats-leon";
  function loadLocal(){ try{ const v = localStorage.getItem(LS); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
  function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(sessions)); }catch(e){} }
  if (!sessions.length) { const l = loadLocal(); if (l && l.length) sessions = l; }

  let saveTimer = null;
  function persist(){
    saveLocal();
    if (!artifactApi) return;
    clearTimeout(saveTimer);
    $("saveState").textContent = "· enregistrement…";
    saveTimer = setTimeout(async () => {
      const json = JSON.stringify(sessions).replace(/</g, "\\u003c");
      const html = SOURCE.replace(
        /(<script id="app-data" type="application\/json">)[\s\S]*?(<\/script>)/,
        (m, a, b) => a + json + b
      );
      try { await artifactApi.publish(html); $("saveState").textContent = "· enregistré ✓"; }
      catch(e){ $("saveState").textContent = "· enregistré sur cet appareil"; }
    }, 600);
  }
  try {
    window.claude && window.claude.use && window.claude.use("artifact").then(a => { artifactApi = a; }).catch(()=>{});
  } catch(e){}

  // ---------- helpers ----------
  const fmtKm = n => (Math.round(n*10)/10).toLocaleString("fr-BE");
  function fmtDur(sec){
    sec = Math.round(sec); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
    return h ? `${h}h${String(m).padStart(2,"0")}` : `${m}min${s?(" "+String(s).padStart(2,"0")+"s"):""}`;
  }
  const pace = (sec,km) => { const p = sec/km; return `${Math.floor(p/60)}:${String(Math.round(p%60)).padStart(2,"0")} /km`; };
  const speed = (sec,km) => (km/(sec/3600)).toLocaleString("fr-BE",{maximumFractionDigits:1}) + " km/h";
  const fmtDate = d => new Date(d+"T12:00").toLocaleDateString("fr-BE",{weekday:"short",day:"numeric",month:"short"});
  const mondayOf = d => { const x = new Date(d); x.setHours(12,0,0,0); const k = (x.getDay()+6)%7; x.setDate(x.getDate()-k); return x; };
  const sel = () => sessions.filter(s => filter==="all" || s.sport===filter);

  // ---------- render ----------
  function render(){
    const list = sel();
    const km = list.reduce((a,s)=>a+s.km,0), sec = list.reduce((a,s)=>a+s.sec,0);
    let effLab = "Vitesse moyenne", effVal = "–";
    if (filter==="run"){ effLab="Allure moyenne"; effVal = km? pace(sec,km) : "–"; }
    else if (km && sec) effVal = speed(sec,km);
    $("kpis").innerHTML = [
      ["Distance totale", km? `${fmtKm(km)}<small>km</small>` : "0<small>km</small>"],
      ["Sorties", list.length],
      ["Temps total", sec? fmtDur(sec) : "0"],
      [effLab, effVal]
    ].map(([l,v])=>`<div class="card kpi"><div class="lab">${l}</div><div class="big">${v}</div></div>`).join("");

    renderChart(); renderRecords(list); renderBadges(); renderList(list);
  }

  function renderChart(){
    const weeks = []; const m0 = mondayOf(new Date());
    for (let i=7;i>=0;i--){ const d = new Date(m0); d.setDate(d.getDate()-7*i); weeks.push({start:d, run:0, bike:0}); }
    sessions.forEach(s=>{
      const m = mondayOf(new Date(s.date+"T12:00")).getTime();
      const w = weeks.find(w=>w.start.getTime()===m); if (w) w[s.sport]+=s.km;
    });
    const showRun = filter!=="bike", showBike = filter!=="run";
    const max = Math.max(5, ...weeks.map(w=>(showRun?w.run:0)+(showBike?w.bike:0)));
    const W=440,H=200,pad=26,bw=(W-pad)/8;
    let g = "";
    [0, .5, 1].forEach(t=>{ const y = H-20-(H-40)*t; g += `<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}" stroke="#2a3a4b"/><text x="${pad-6}" y="${y+4}" fill="#8ea2b6" font-size="10" text-anchor="end">${Math.round(max*t)}</text>`; });
    weeks.forEach((w,i)=>{
      const x = pad + i*bw + bw*0.18, bwi = bw*0.64; let y = H-20;
      const parts = [];
      if (showBike && w.bike) parts.push(["#2ec4b6", w.bike]);
      if (showRun && w.run) parts.push(["#ff6b3d", w.run]);
      parts.forEach(([c,v])=>{ const h=(H-40)*v/max; y-=h; g+=`<rect x="${x}" y="${y}" width="${bwi}" height="${Math.max(h,0)}" rx="4" fill="${c}"><title>${fmtKm(v)} km</title></rect>`; });
      const tot = (showRun?w.run:0)+(showBike?w.bike:0);
      if (tot) g += `<text x="${x+bwi/2}" y="${y-5}" fill="#eef3f8" font-size="10" text-anchor="middle">${fmtKm(tot)}</text>`;
      g += `<text x="${x+bwi/2}" y="${H-5}" fill="#8ea2b6" font-size="10" text-anchor="middle">${w.start.getDate()}/${w.start.getMonth()+1}</text>`;
    });
    $("chart").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kilomètres par semaine">${g}</svg>`;
  }

  function renderRecords(list){
    const best = (arr, f) => arr.length ? arr.reduce((a,b)=> f(b)>f(a)?b:a) : null;
    const runs = sessions.filter(s=>s.sport==="run"), bikes = sessions.filter(s=>s.sport==="bike");
    const lr = best(runs, s=>s.km), fr = best(runs.filter(s=>s.km>=1), s=>-s.sec/s.km);
    const lb = best(bikes, s=>s.km), fb = best(bikes, s=>s.km/s.sec);
    const items = [];
    if (filter!=="bike"){ items.push(["🏃 Plus longue course", lr? `${fmtKm(lr.km)} km` : "–"], ["🏃 Meilleure allure", fr? pace(fr.sec,fr.km) : "–"]); }
    if (filter!=="run"){ items.push(["🚴 Plus longue sortie vélo", lb? `${fmtKm(lb.km)} km` : "–"], ["🚴 Plus rapide à vélo", fb? speed(fb.sec,fb.km) : "–"]); }
    $("records").innerHTML = items.map(([l,v])=>`<div class="rec"><div class="lab">${l}</div><div class="v">${v}</div></div>`).join("");
  }

  function renderBadges(){
    const runs = sessions.filter(s=>s.sport==="run"), bikes = sessions.filter(s=>s.sport==="bike");
    const sum = a => a.reduce((x,s)=>x+s.km,0);
    const B = [
      ["🎉","Première sortie", sessions.length>=1],
      ["🏃","Premier 5 km", runs.some(s=>s.km>=5)],
      ["🔥","Premier 10 km", runs.some(s=>s.km>=10)],
      ["🚴","Sortie vélo de 20 km", bikes.some(s=>s.km>=20)],
      ["🚀","Sortie vélo de 50 km", bikes.some(s=>s.km>=50)],
      ["⭐","10 sorties", sessions.length>=10],
      ["🏅","50 km de course au total", sum(runs)>=50],
      ["🏆","200 km de vélo au total", sum(bikes)>=200],
      ["🌍","500 km en tout", sum(sessions)>=500],
    ];
    $("badges").innerHTML = B.map(([e,t,ok])=>`<div class="badge ${ok?"got":""}" title="${ok?"Débloqué !":"Pas encore…"}"><span class="e">${e}</span>${t}</div>`).join("");
  }

  function renderList(list){
    if (!list.length){ $("list").innerHTML = `<div class="empty">Pas encore de sortie ici. Ajoute ta première ! 👟</div>`; return; }
    const rows = [...list].sort((a,b)=> b.date.localeCompare(a.date) || b.id-a.id).map(s=>`
      <tr>
        <td>${fmtDate(s.date)}</td>
        <td><span class="pill ${s.sport}">${s.sport==="run"?"Course":"Vélo"}</span></td>
        <td><b>${fmtKm(s.km)} km</b></td>
        <td>${fmtDur(s.sec)}</td>
        <td>${s.sport==="run"? pace(s.sec,s.km) : speed(s.sec,s.km)}</td>
        <td class="hide-s note">${esc(s.note||"")}</td>
        <td style="text-align:right"><button class="del ${pendingDel===s.id?"sure":""}" data-id="${s.id}">${pendingDel===s.id?"Sûr ?":"Supprimer"}</button></td>
      </tr>`).join("");
    $("list").innerHTML = `<table><thead><tr><th>Date</th><th>Sport</th><th>Distance</th><th>Durée</th><th>Allure / vitesse</th><th class="hide-s">Note</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  // ---------- events ----------
  $("tabs").addEventListener("click", e=>{
    const b = e.target.closest("button"); if (!b) return;
    filter = b.dataset.f; document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on", x===b)); render();
  });
  document.querySelectorAll(".sport button").forEach(b=> b.addEventListener("click", ()=>{
    sport = b.dataset.s; document.querySelectorAll(".sport button").forEach(x=>x.classList.toggle("on", x===b));
    $("dist").placeholder = sport==="run" ? "5" : "20";
  }));
  $("date").value = new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);

  // ---------- GPX import ----------
  function hav(a,b){
    const R=6371, r=x=>x*Math.PI/180;
    const dLa=r(b.lat-a.lat), dLo=r(b.lon-a.lon);
    const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;
    return 2*R*Math.asin(Math.sqrt(h));
  }
  $("gpx").addEventListener("change", async e=>{
    const file = e.target.files && e.target.files[0]; if (!file) return;
    try{
      const xml = new DOMParser().parseFromString(await file.text(), "application/xml");
      const pts = [...xml.getElementsByTagName("trkpt")].map(p=>{
        const t = p.getElementsByTagName("time")[0];
        return { lat:+p.getAttribute("lat"), lon:+p.getAttribute("lon"), t: t? Date.parse(t.textContent) : NaN };
      }).filter(p=>isFinite(p.lat)&&isFinite(p.lon));
      if (pts.length < 2) { $("msg").textContent = "Ce fichier ne contient pas de trajet 😕"; return; }
      let km = 0; for (let i=1;i<pts.length;i++) km += hav(pts[i-1], pts[i]);
      const times = pts.map(p=>p.t).filter(isFinite);
      const sec = times.length>=2 ? Math.round((times[times.length-1]-times[0])/1000) : 0;
      $("dist").value = Math.round(km*100)/100;
      if (sec>0){ $("hh").value = Math.floor(sec/3600); $("mm").value = Math.floor(sec%3600/60); $("ss").value = sec%60; }
      if (times.length){ const d = new Date(times[0]); $("date").value = new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
      $("msg").textContent = sec>0
        ? `Trajet lu : ${fmtKm(km)} km en ${fmtDur(sec)} ✨ Choisis Course ou Vélo, puis Enregistrer !`
        : `Trajet lu : ${fmtKm(km)} km ✨ Ajoute la durée, puis Enregistrer !`;
    }catch(err){ $("msg").textContent = "Je n'arrive pas à lire ce fichier 😕"; }
    e.target.value = "";
  });

  $("f").addEventListener("submit", e=>{
    e.preventDefault();
    const km = parseFloat($("dist").value), sec = (+$("hh").value||0)*3600 + (+$("mm").value||0)*60 + (+$("ss").value||0);
    if (!(km>0)) { $("msg").textContent = "Indique une distance 😉"; return; }
    if (!(sec>0)) { $("msg").textContent = "Indique combien de temps ça a duré ⏱️"; return; }
    const spd = km/(sec/3600);
    if ((sport==="run" && spd>30) || (sport==="bike" && spd>80)) { $("msg").textContent = "Hmm, c'est super rapide ! Vérifie la distance et la durée 🤔"; return; }
    const before = sessions.length;
    sessions.push({ id: Date.now(), sport, date: $("date").value, km, sec, note: $("note").value.trim() });
    $("msg").textContent = before===0 ? "Bravo pour ta première sortie ! 🎉" : `Bien joué ! ${fmtKm(km)} km de plus 💪`;
    ["dist","hh","mm","ss","note"].forEach(id=>$(id).value="");
    render(); persist();
  });

  $("list").addEventListener("click", e=>{
    const b = e.target.closest(".del"); if (!b) return;
    const id = +b.dataset.id;
    if (pendingDel===id){ sessions = sessions.filter(s=>s.id!==id); pendingDel=null; render(); persist(); }
    else { pendingDel=id; render(); setTimeout(()=>{ if(pendingDel===id){ pendingDel=null; render(); } }, 3000); }
  });

  render();
})();
</script>
</body>
</html>
