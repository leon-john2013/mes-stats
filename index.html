  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  .wrap{max-width:720px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 30px rgba(0,10,40,.5)}

  /* Accueil */
  .hero{margin:6px 0 44px}
  .acct{margin:-28px 0 22px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;font:600 15px Nunito,sans-serif;color:var(--txt)}
  .acct .row{display:flex;align-items:center;gap:10px;justify-content:space-between}
  .acct .who{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
  .acct p{margin:0 0 10px;color:var(--muted)}
  .acct button{border:0;border-radius:14px;padding:11px 14px;font:700 15px Fredoka,Nunito,sans-serif;cursor:pointer}
  .acct .g{width:100%;background:#fff;color:#0b1533;display:flex;align-items:center;justify-content:center;gap:10px}
  .acct .lnk{background:none;color:var(--muted);padding:8px 4px;text-decoration:underline;font-weight:600}
  .acct .out{background:var(--card2);color:var(--muted);padding:8px 12px;font-size:13px;flex:none}
  .acct input{width:100%;box-sizing:border-box;margin:0 0 8px;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card2);color:var(--txt);font:600 16px Nunito,sans-serif}
  .acct .two{display:flex;gap:8px}.acct .two button{flex:1;background:var(--blue);color:#fff}
  .acct .two button.alt{background:var(--card2);color:var(--txt)}
  .acct .err{color:#ff9db0;margin:8px 0 0;font-size:14px}
  .hero{position:relative}
  .flagbox{position:relative;display:flex;justify-content:flex-end;margin:-4px 0 6px;z-index:20}
  .flagbtn{background:none;border:0;padding:6px;margin:-6px;cursor:pointer;display:block;-webkit-tap-highlight-color:transparent}
  .flagbtn svg{width:44px;height:35px;display:block}
  .flagbtn.on svg{filter:drop-shadow(0 0 6px #00e5ff88)}
  .flagbtn.wait svg{opacity:.6}
  .flagbtn.bad svg{filter:drop-shadow(0 0 6px #ff4d6d)}
  .flagbox .pop{position:absolute;right:0;top:44px;width:250px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 12px 30px #000a;font:600 15px Nunito,sans-serif;color:var(--txt)}
  .flagbox .pop p{margin:0 0 12px;line-height:1.35}
  .flagbox .pop .err{color:#ff9db0}
  .flagbox .two{display:flex;gap:8px}
  .flagbox .two button{flex:1;border:0;border-radius:14px;padding:11px 8px;font:700 14px Fredoka,Nunito,sans-serif;cursor:pointer}
  .flagbox .alt{background:var(--card2);color:var(--txt)}
  .flagbox .danger{background:#ff4d6d;color:#fff}
  .bigbtn{display:flex;align-items:center;gap:16px;width:100%;border:2px solid var(--line);background:var(--card);color:var(--txt);border-radius:22px;padding:22px 20px;font:800 24px Fredoka,Nunito,sans-serif;cursor:pointer;text-align:left;transition:transform .1s,border-color .2s,box-shadow .2s}

  .panel{margin-top:18px}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-weight:800;font-size:17px;cursor:pointer;text-align:center;color:#fff;background:var(--blue);box-shadow:0 0 18px rgba(61,139,255,.55)}
  .btn.ghost{background:none;box-shadow:none;border:1px solid var(--line);color:var(--muted);font:600 14px Nunito,sans-serif;padding:11px}
  .btn input{display:none}
  .link{background:none;border:0;color:var(--muted);text-decoration:underline;font:14px Nunito,sans-serif;cursor:pointer;display:block;margin:12px auto 0}
  .msg{min-height:20px;font-size:14px;margin-top:10px;color:var(--bike);text-align:center}

  .preview .row{display:flex;gap:10px;flex-wrap:wrap}
  .pv{flex:1;min-width:120px;background:var(--card2);border-radius:12px;padding:10px 12px}
  .pv .lab{font-size:12px;color:var(--muted)} .pv .v{font:800 20px Fredoka,Nunito,sans-serif;margin-top:2px}
  label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1;min-width:90px}
  input{background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font:16px Nunito,sans-serif;width:100%}
  input:focus{outline:2px solid var(--bike);border-color:transparent}
  .dur{display:flex;gap:6px} .dur input{text-align:center}
  .fields{display:flex;flex-direction:column;gap:10px;margin:12px 0}
  .fields .row{display:flex;gap:10px}

  /* Stats */
  .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
  .kpi .lab{color:var(--muted);font-size:13px}

  .chart svg{width:100%;height:auto;display:block}
  .records{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

  .badge .e{font-size:18px}

  .item .t{font-weight:600}
  .item .s{font-size:13px;color:var(--muted);margin-top:2px}

  .empty{color:var(--muted);text-align:center;padding:30px 10px}
  h3{font:700 17px Fredoka,Nunito,sans-serif;margin:0 0 12px}


  .item{width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--txt);text-align:left;font:inherit;cursor:pointer}
  .item:active{background:var(--card2)}

  .leaflet-container{background:#071233;font-family:Nunito,sans-serif}

  .leaflet-tile-pane{filter:invert(1) hue-rotate(200deg) saturate(.55) brightness(.95) contrast(1.1)}
  .leaflet-control-attribution{background:rgba(5,11,31,.7)!important;color:#8aa0d6!important;font-size:9px!important}
  .leaflet-control-attribution a{color:#8aa0d6!important}
  .leaflet-bar a{background:#0d1736!important;color:#cfe3ff!important;border-color:#1c2f66!important}
  .pin{width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 10px #1f8bff}
  .pin.go{background:#1f8bff} .pin.end{background:#00e5ff}
  .maplegend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:8px}
  .maplegend i{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid #fff;margin-right:6px;vertical-align:-1px}
  .nomap{color:var(--muted);font-size:14px}
</style>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // ---------- sauvegarde (dans le téléphone) ----------
  const LS = "sport-stats-leon";
  let sessions = [];
  try { sessions = JSON.parse(localStorage.getItem(LS)) || []; } catch(e){ sessions = []; }
  const save = () => { try { localStorage.setItem(LS, JSON.stringify(sessions)); } catch(e){} if (window.upsCloud) window.upsCloud(sessions); };
  // ---------- lien avec la sauvegarde en ligne (Firebase) ----------
  window.ups = {
    get: () => sessions,
    set: list => {
      sessions = list;
      try { localStorage.setItem(LS, JSON.stringify(sessions)); } catch(e){}
      const v = document.querySelector(".view.on");
      if (v && v.id !== "v-home") renderStats(v.id.slice(2));
    }
  };

  // ---------- on enlève les fausses stats d'exemple ----------
  // ---------- fausses stats d'exemple (ajoutées une seule fois) ----------
  const DEMO_KEY = "sport-stats-leon-demo2";
  function demoTrack(seed, km){
    let x = seed; const r = () => (x = x*48271 % 2147483647) / 2147483647;
    const lat0 = 50.6 + r()*0.3, lon0 = 4.2 + r()*0.6, R = km/(2*Math.PI)/111, n = 120, wob = [r(),r(),r()];
    const t = [];
    for (let i=0;i<=n;i++){
      const a = i/n*2*Math.PI, f = 1 + .25*Math.sin(3*a+wob[0]*6) + .12*Math.sin(5*a+wob[1]*6);
      t.push([+(lat0 + R*f*Math.sin(a)).toFixed(5), +(lon0 + R*1.5*f*Math.cos(a+wob[2])).toFixed(5)]);
    }
    return t;
  }
  try {
    if (!localStorage.getItem(DEMO_KEY)) {
      const ago = n => { const d = new Date(); d.setDate(d.getDate()-n); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
      const ex = [
        ["run",52,3.2,1260,"Premier essai 😅"],["run",45,4.1,1500,""],["run",38,5.0,1740,"Mon premier 5 km !"],
        ["run",30,4.6,1530,"Avec papa"],["run",24,6.2,2130,""],["run",17,5.5,1800,"Il pleuvait 🌧️"],
        ["run",10,7.4,2520,"Record de distance"],["run",4,5.1,1590,"Très rapide aujourd'hui ⚡"],
        ["bike",49,12.5,2700,"Balade tranquille"],["bike",35,18.2,3600,""],["bike",28,22.4,4200,"Avec les copains"],
        ["bike",21,15.8,2880,"Beaucoup de vent 💨"],["bike",13,31.0,5700,"Grosse sortie !"],["bike",6,24.6,4320,""]
      ];
      ex.forEach(([sp,d,km,sec,note],i)=>sessions.push({ id: 1000+i, sport:sp, date: ago(d), km, sec, note, demo:true, track: demoTrack(7919*(i+3), km) }));
      localStorage.setItem(DEMO_KEY, "1"); save();
    }
  } catch(e){}
  // on enlève la fausse course de test du plan
  if (sessions.some(x=>x.id===2001 && x.demo)) { sessions = sessions.filter(x=>!(x.id===2001 && x.demo)); save(); }

  // ---------- outils ----------
  const fmtKm = n => (Math.round(n*10)/10).toLocaleString("fr-BE");
  function fmtDur(sec){
    sec = Math.round(sec); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
    return h ? `${h}h${String(m).padStart(2,"0")}` : `${m}min${s?(" "+String(s).padStart(2,"0")+"s"):""}`;
  }
  const pace = (sec,km) => { const p = sec/km; let m = Math.floor(p/60), s = Math.round(p%60); if (s===60){m++;s=0;} return `${m}:${String(s).padStart(2,"0")} /km`; };
  const speed = (sec,km) => (km/(sec/3600)).toLocaleString("fr-BE",{maximumFractionDigits:1}) + " km/h";
  const effort = (s) => s.sport==="run" ? pace(s.sec,s.km) : speed(s.sec,s.km);
  const fmtDate = d => new Date(d+"T12:00").toLocaleDateString("fr-BE",{weekday:"short",day:"numeric",month:"short"});
  const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
  const mondayOf = d => { const x = new Date(d); x.setHours(12,0,0,0); x.setDate(x.getDate()-(x.getDay()+6)%7); return x; };
  const NAME = { run:"course", bike:"sortie vélo" };
  // deux petits drapeaux à damier croisés : bleus pour les stats globales, mauves pour une sortie
  const flags = m => `<svg class="flg${m?" m":""}" viewBox="0 0 28 22" width="28" height="22" style="width:${(1.35*28/22).toFixed(2)}em" aria-hidden="true"><g stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 2 Q4.5 .6 1 2.6 L3.2 9.6 Q6.8 7.6 10.4 7.8 Z" fill="url(#${m?"chkM":"chkB"})" stroke="${m?"#d18cff":"#00e5ff"}" stroke-width="1"/>
    <path d="M20 2 Q23.5 .6 27 2.6 L24.8 9.6 Q21.2 7.6 17.6 7.8 Z" fill="url(#${m?"chkM":"chkB"})" stroke="${m?"#d18cff":"#00e5ff"}" stroke-width="1"/>
    <path d="M8 2 L16 21 M20 2 L12 21" stroke="${m?"#d18cff":"#00e5ff"}" stroke-width="2"/></g></svg>`;
  // chrono, petit coureur et petit cycliste, dans le même style
  const ic = (m, vb, body) => `<svg class="flg${m?" m":""}" viewBox="${vb}" width="${vb.split(" ")[2]}" height="${vb.split(" ")[3]}" style="width:${(1.35*vb.split(" ")[2]/vb.split(" ")[3]).toFixed(2)}em" aria-hidden="true"><g fill="none" stroke-linecap="round" stroke-linejoin="round">${body(m?"#d18cff":"#00e5ff", m?"#9d4dff":"#2f7bff")}</g></svg>`;
  const chrono = m => ic(m, "0 0 22 22", (a,b)=>`<path d="M9 1.5 H13 M11 1.5 V4 M17.2 5.6 L18.8 4" stroke="${a}" stroke-width="2"/><circle cx="11" cy="12.5" r="8" fill="${b}" stroke="${a}" stroke-width="2"/><path d="M11 12.5 L11 7.8 M11 12.5 L14 14.3" stroke="#fff" stroke-width="1.8"/>`);
  const runner = m => ic(m, "0 0 22 22", (a,b)=>`<circle cx="13.5" cy="3.2" r="2.3" fill="${a}" stroke="none"/><path d="M12.6 6.5 L10.6 12.5" stroke="${b}" stroke-width="3.4"/><path d="M12.4 7.5 L15.5 10 L18 8.6 M12 7.6 L8.6 6.6 L6.6 9.4 M10.6 12.5 L14.2 15.2 L13.4 20 M10.6 12.5 L7.6 16.6 L3.6 16" stroke="${a}" stroke-width="1.9"/>`);
  const cyclist = m => ic(m, "0 0 26 22", (a,b)=>`<circle cx="6" cy="16" r="4.6" stroke="${a}" stroke-width="1.8"/><circle cx="20" cy="16" r="4.6" stroke="${a}" stroke-width="1.8"/><path d="M6 16 L10 10 L17 10 L20 16 M10 10 L13 16 L17 10" stroke="${b}" stroke-width="1.8"/><circle cx="17.5" cy="3" r="2.2" fill="${a}" stroke="none"/><path d="M10.5 8 Q13 4.6 16.6 6 L18.6 9" stroke="${a}" stroke-width="2.2"/><path d="M11 8.5 L14 12 L13 16" stroke="${a}" stroke-width="1.8"/>`);
  const trophy = m => ic(m, "0 0 22 22", (a,b)=>`<path d="M6 3 H16 V8.5 Q16 13.5 11 13.5 Q6 13.5 6 8.5 Z" fill="${b}" stroke="${a}" stroke-width="1.8"/><path d="M6 5 H3.2 Q3 9.4 6.6 10 M16 5 H18.8 Q19 9.4 15.4 10" stroke="${a}" stroke-width="1.6"/><path d="M11 13.5 V17 M7 19.5 H15 L14 17 H8 Z" stroke="${a}" stroke-width="1.8" fill="${a}"/><path d="M8.6 5.6 V8.4" stroke="#fff" stroke-width="1.4"/>`);
  const spdIcon = (sp, m) => sp==="run" ? runner(m) : cyclist(m);

  // ---------- onglets ----------
  function show(v){
    document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on", x.id==="v-"+v));
    document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on", x.dataset.v===v));
    if (v==="home") document.documentElement.classList.remove("mauve");
    if (v!=="home") renderStats(v);
    window.scrollTo(0,0);
  }
  document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click", ()=>{
    // changer d'onglet ferme la sortie ouverte : on revient aux stats globales
    focus.run = null; focus.bike = null; sureDel = false;
    // quand on revient sur l'accueil depuis un autre onglet, rien n'est sélectionné
    if (t.dataset.v==="home" && !$("v-home").classList.contains("on")){
      sport = null; document.querySelectorAll(".bigbtn").forEach(x=>x.classList.remove("on"));
      $("panel").hidden = true; resetPanel();
    }
    show(t.dataset.v);
  }));

  // ---------- accueil ----------
  let sport = null, pendingTrack = null;
  function resetPanel(){
    pendingTrack = null;
    $("step-import").hidden = false; $("step-check").hidden = true;
    ["date","dist","hh","mm","ss","note"].forEach(id=>$(id).value="");
    $("durField").hidden = false;
    $("pvBoxes").innerHTML = ""; $("msg").textContent = "";
  }
  document.querySelectorAll(".bigbtn").forEach(b=>b.addEventListener("click", ()=>{
    if (sport === b.dataset.s) {
      sport = null; b.classList.remove("on"); $("panel").hidden = true; resetPanel(); return;
    }
    sport = b.dataset.s;
    document.querySelectorAll(".bigbtn").forEach(x=>x.classList.toggle("on", x===b));
    $("panel").hidden = false; resetPanel();
  }));

  function openCheck(title){
    $("step-import").hidden = true; $("step-check").hidden = false;
    $("checkTitle").textContent = title;
    if (!$("date").value) $("date").value = today();
    updatePreview();
  }
  function readForm(){
    const km = parseFloat($("dist").value);
    const sec = (+$("hh").value||0)*3600 + (+$("mm").value||0)*60 + (+$("ss").value||0);
    return {km, sec};
  }
  function updatePreview(){
    const {km, sec} = readForm();
    const boxes = [];
    if ($("date").value) boxes.push(["Date", fmtDate($("date").value)]);
    if (km>0) boxes.push([flags()+"Distance", fmtKm(km)+" km"]);
    if (sec>0) boxes.push([chrono()+"Durée", fmtDur(sec)]);
    if (km>0 && sec>0) boxes.push([spdIcon(sport)+(sport==="run"?"Allure":"Vitesse"), sport==="run"?pace(sec,km):speed(sec,km)]);
    $("pvBoxes").innerHTML = boxes.map(([l,v])=>`<div class="pv"><div class="lab">${l}</div><div class="v">${v}</div></div>`).join("");
  }
  ["dist","hh","mm","ss"].forEach(id=>$(id).addEventListener("input", updatePreview));

  $("cancelBtn").addEventListener("click", resetPanel);

  // lecture du fichier GPX
  function hav(a,b){
    const R=6371, r=x=>x*Math.PI/180;
    const dLa=r(b.lat-a.lat), dLo=r(b.lon-a.lon);

    return 2*R*Math.asin(Math.sqrt(h));
  }

  function chart(list, color){
    const weeks = []; const m0 = mondayOf(new Date());
    for (let i=7;i>=0;i--){ const d = new Date(m0); d.setDate(d.getDate()-7*i); weeks.push({start:d, km:0}); }
    list.forEach(s=>{ const m = mondayOf(new Date(s.date+"T12:00")).getTime(); const w = weeks.find(w=>w.start.getTime()===m); if (w) w.km+=s.km; });
    const max = Math.max(5, ...weeks.map(w=>w.km))*1.12;
    const W=440,H=200,pad=28,top=22,bottom=24, step=(W-pad-30)/7;
    const X = i => pad + 7 + i*step, Y = v => H-bottom-(H-bottom-top)*v/max;
    let g = "";
    [0,.5,1].forEach(t=>{ const v=max*t, y=Y(v); g+=`<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}" stroke="#1c2f66"/><text x="${pad-6}" y="${y+4}" fill="#8aa0d6" font-size="10" text-anchor="end">${Math.round(v)}</text>`; });
    const pts = weeks.map((w,i)=>[X(i), Y(w.km)]);
    const line = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
    const gid = "grad"+color.slice(1);
    g += `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`;
    g += `<path d="${line} L${pts[7][0].toFixed(1)} ${H-bottom} L${pts[0][0].toFixed(1)} ${H-bottom} Z" fill="url(#${gid})"/>`;
    g += `<path d="${line}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" style="filter:drop-shadow(0 0 4px ${color})"/>`;
    weeks.forEach((w,i)=>{
      const [x,y] = pts[i];
      g += `<circle cx="${x}" cy="${y}" r="4.5" fill="#050b1f" stroke="${color}" stroke-width="2.4"/>`;
      if (w.km) g += `<text x="${x}" y="${y-10}" fill="#eaf1ff" font-size="10" text-anchor="middle">${fmtKm(w.km)}</text>`;
      g += `<text x="${x}" y="${H-6}" fill="#8aa0d6" font-size="10" text-anchor="middle">${w.start.getDate()}/${w.start.getMonth()+1}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kilomètres par semaine">${g}</svg>`;
  }

  function spin(el){
    const cells = el.querySelectorAll(".roll");
    const T = 3000, T1 = 1500;
    cells.forEach(c=>{
      const final = c.innerHTML;
      const plain = c.textContent;
      let strip = "";
      for (let i=0;i<70;i++) strip += `<span class="fk">${fakeLike(plain)}</span>`;
      c.innerHTML = `<span class="strip">${strip}<span class="fin">${final}</span></span>`;
    });
    const items = [...cells].map(c=>{ const st=c.firstChild, fin=st.lastChild; return {st, D: fin.offsetLeft}; });
    const t0 = performance.now();
    function frame(now){
      const t = Math.min(now - t0, T);
      items.forEach(({st,D})=>{
        const v = D / (T1 + (T-T1)/2);           // vitesse constante, puis freinage régulier
        const x = t<=T1 ? v*t : v*T1 + v*(t-T1) - v*(t-T1)*(t-T1)/(2*(T-T1));
        st.style.transform = `translateX(${-x}px)`;
      });
      if (t < T) requestAnimationFrame(frame);
      else cells.forEach(c=>{ const f=c.querySelector(".fin"); if (f) c.innerHTML = f.innerHTML; });
    }
    requestAnimationFrame(frame);
  }

  function rng(seed){ let x = seed % 2147483647 || 7; return () => (x = x*48271 % 2147483647) / 2147483647; }
  const STREETS = ["Avenue des Champions","Rue du Sprint","Chemin des Mollets","Boulevard du Vélo","Rue de la Foulée","Avenue du Maillot","Rue des Baskets","Allée du Dossard","Rue du Pédalier","Avenue de l'Arrivée","Rue du Chrono","Place du Podium"];

  // dessine un faux plan de quartier (rues, parc, lac) autour du tracé
  function fakePlan(track, id){
    const la = track.map(p=>p[0]), lo = track.map(p=>p[1]);
    let a0 = Math.min(...la), a1 = Math.max(...la), o0 = Math.min(...lo), o1 = Math.max(...lo);
    const pa = (a1-a0)*0.9+0.004, po = (o1-o0)*0.9+0.006;
    a0-=pa; a1+=pa; o0-=po; o1+=po;
    const k = Math.cos((a0+a1)/2*Math.PI/180), S = 111200;
    const X = lon => (lon-o0)*k*S, Y = lat => (a1-lat)*S;
    const W = X(o1), H = Y(a0), R = rng(id*7919+13);
    let g = `<rect width="${W}" height="${H}" fill="#0c1636"/>`;
    // pâtés de maisons
    const step = Math.max(W,H)/26, u = step/130, ang = (R()*30-15);
    g += `<g transform="rotate(${ang.toFixed(1)} ${W/2} ${H/2})">`;
    const ext = Math.max(W,H)*0.75, cx = W/2, cy = H/2;
    for (let x=cx-ext; x<cx+ext; x+=step) for (let y=cy-ext; y<cy+ext; y+=step)
      if (R()>0.08) g += `<rect x="${(x+9*u).toFixed(0)}" y="${(y+9*u).toFixed(0)}" width="${step-18*u}" height="${step-18*u}" rx="${6*u}" fill="#121f47"/>`;
    // grandes avenues avec leur nom
    let n = 0; const names = [...STREETS].sort(()=>R()-0.5);
    for (let i=-ext; i<ext; i+=step*4){
      const nm = names[n++ % names.length], nm2 = names[n++ % names.length];
      g += `<line x1="${cx-ext}" y1="${cy+i}" x2="${cx+ext}" y2="${cy+i}" stroke="#2a3f80" stroke-width="${16*u}"/>`;
      g += `<line x1="${cx+i}" y1="${cy-ext}" x2="${cx+i}" y2="${cy+ext}" stroke="#2a3f80" stroke-width="${16*u}"/>`;
      g += `<text x="${cx+i*0.3}" y="${cy+i-22*u}" fill="#8ea3d8" font-size="${62*u}" font-family="Nunito,sans-serif" text-anchor="middle">${nm}</text>`;
      g += `<text x="${cx+i+22*u}" y="${cy+i*0.3}" fill="#8ea3d8" font-size="${62*u}" font-family="Nunito,sans-serif" transform="rotate(90 ${cx+i+22*u} ${cy+i*0.3})" text-anchor="middle">${nm2}</text>`;
    }
    g += `</g>`;
    // le parc autour du parcours
    const mx = (Math.min(...lo)+Math.max(...lo))/2, my = (Math.min(...la)+Math.max(...la))/2;
    const rx = (Math.max(...lo)-Math.min(...lo))*k*S*0.18, ry = (Math.max(...la)-Math.min(...la))*S*0.16;
    const park = track.map(([a,b])=>{ const px = X(mx + (b-mx)*1.35), py = Y(my + (a-my)*1.35); return px.toFixed(0)+","+py.toFixed(0); }).join(" ");
    g += `<polygon points="${park}" fill="#17275a" stroke="#22397a" stroke-width="${10*u}" stroke-linejoin="round"/>`;
    g += `<text x="${X(mx)}" y="${Y(my)+ry+110*u}" fill="#8ea8e8" font-size="${70*u}" font-family="Nunito,sans-serif" text-anchor="middle">Parc des Coureurs</text>`;
    // un lac au milieu
    g += `<ellipse cx="${X(mx)}" cy="${Y(my)}" rx="${rx}" ry="${ry}" fill="#123a6e" stroke="#1d5299" stroke-width="${6*u}"/>`;
    g += `<text x="${X(mx)}" y="${Y(my)+20*u}" fill="#8fc0ff" font-size="${56*u}" font-style="italic" font-family="Nunito,sans-serif" text-anchor="middle">Lac Bleu</text>`;
    return { svg: g, W, H, bounds: [[a0,o0],[a1,o1]], X, Y };
  }

  function drawMap(box, track, color, isDemo, id, free){
    if (free){ if (bigMap){ try{ bigMap.remove(); }catch(e){} bigMap = null; } }
    else if (mapObj){ try{ m.remove(); }catch(e){} mapObj = null; }
    let m = null;
    const plan = isDemo ? fakePlan(track, id) : null;
    if (window.L && L.map){
      try{
        box.innerHTML = "";
        // petite carte : figée (ni bouger, ni zoomer) ; grande carte : libre
        m = L.map(box, free
          ? { zoomControl:false, attributionControl:true }
          : { zoomControl:false, attributionControl:true, dragging:false, touchZoom:false, doubleClickZoom:false, scrollWheelZoom:false, boxZoom:false, keyboard:false, tap:false });
        if (free) bigMap = m; else mapObj = m;
        m.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
        if (plan){
          const el = document.createElementNS("http://www.w3.org/2000/svg","svg");
          el.setAttribute("viewBox", `0 0 ${plan.W} ${plan.H}`); el.setAttribute("preserveAspectRatio","none");
          el.innerHTML = plan.svg;
          L.svgOverlay(el, plan.bounds).addTo(m);
          m.attributionControl.addAttribution("Plan inventé pour l'exemple");
        } else {
          // plan des rues OpenStreetMap (gratuit, sans clé)
          L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom:19, attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
          }).addTo(m);
        }
        L.polyline(track, { color:TRACK_GLOW, weight:9, opacity:.95 }).addTo(m);
        const line = L.polyline(track, { color:TRACK, weight:5, opacity:1, lineJoin:"round", smoothFactor:0.5 }).addTo(m);
        const pin = c => L.divIcon({ className:"", html:`<div class="pin ${c}"></div>`, iconSize:[16,16], iconAnchor:[8,8] });
        L.marker(track[track.length-1], { icon:pin("end") }).addTo(m);
        L.marker(track[0], { icon:pin("go"), zIndexOffset:1000 }).addTo(m);
        m.fitBounds(line.getBounds(), { padding: free ? [40,40] : [24,24] });
        if (free) setTimeout(()=>{ if (bigMap===m){ m.invalidateSize(); m.fitBounds(line.getBounds(), { padding:[40,40] }); } }, 60);
        return;
      }catch(e){ if (free) bigMap = null; else mapObj = null; }
    }
    // Leaflet n'a pas chargé : on essaie une 2e adresse, puis on redessine la carte
    if (!window.L && !drawMap.retry){
      drawMap.retry = true;
      const css = document.createElement("link"); css.rel="stylesheet"; css.href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"; document.head.appendChild(css);
      const js = document.createElement("script"); js.src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js";
      js.onload = ()=>{ if (document.body.contains(box)) drawMap(box, track, color, isDemo, id, free); };
      document.head.appendChild(js);
    }
    // sans internet : on dessine juste le tracé (et le faux plan pour les exemples)
    const la = track.map(p=>p[0]), lo = track.map(p=>p[1]);
    const k = Math.cos((Math.min(...la)+Math.max(...la))/2*Math.PI/180);
    const x0 = Math.min(...lo), x1 = Math.max(...lo), y0 = Math.min(...la), y1 = Math.max(...la);
    const W = 400, H = 260, pad = 24, sc = Math.min((W-2*pad)/(((x1-x0)*k)||1e-6), (H-2*pad)/((y1-y0)||1e-6));
    const ox = (W-(x1-x0)*k*sc)/2, oy = (H-(y1-y0)*sc)/2;
    const P = ([a,b]) => [ox+(b-x0)*k*sc, H-oy-(a-y0)*sc];
    let bg = "";
    if (plan){
      const [px,py] = P([plan.bounds[1][0], plan.bounds[0][1]]), [qx,qy] = P([plan.bounds[0][0], plan.bounds[1][1]]);
      bg = `<svg x="${px}" y="${py}" width="${qx-px}" height="${qy-py}" viewBox="0 0 ${plan.W} ${plan.H}" preserveAspectRatio="none">${plan.svg}</svg>`;
    }
    const d = track.map((p,i)=>{ const [x,y]=P(p); return (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1); }).join(" ");
    const [sx,sy] = P(track[0]), [ex,ey] = P(track[track.length-1]);
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${bg}<path d="${d}" fill="none" stroke="${TRACK_GLOW}" stroke-opacity=".95" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${TRACK}" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${ex}" cy="${ey}" r="7" fill="#00e5ff" stroke="#fff" stroke-width="3"/><circle cx="${sx}" cy="${sy}" r="7" fill="#1f8bff" stroke="#fff" stroke-width="3"/></svg>`;
  }
})();
</script>
<script type="module">
// ---------- sauvegarde en ligne : connexion + sorties rangées dans ton compte Firebase ----------
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCBMN5E4cFnygv2bXCNvV3aVMZzV91wq7g",
  authDomain: "p-tite-course.firebaseapp.com",
  projectId: "p-tite-course",
  storageBucket: "p-tite-course.firebasestorage.app",
  messagingSenderId: "123940339674",
  appId: "1:123940339674:web:dfad03533a7db9e1b90ae3"
});
const auth = getAuth(app), db = getFirestore(app);
const box = document.getElementById("acct");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const ERR = {
  "auth/popup-blocked": "La fenêtre Google a été bloquée. Réessaie, ou connecte-toi avec un e-mail.",
  "auth/popup-closed-by-user": "Tu as fermé la fenêtre avant la fin 😉",
  "auth/cancelled-popup-request": "Tu as fermé la fenêtre avant la fin 😉",
  "auth/operation-not-allowed": "Cette façon de se connecter n'est pas encore activée dans Firebase.",
  "auth/unauthorized-domain": "Le site n'est pas encore autorisé dans Firebase (Domaines autorisés).",
  "auth/invalid-credential": "E-mail ou mot de passe incorrect.",
  "auth/wrong-password": "Mot de passe incorrect.",
  "auth/user-not-found": "Pas de compte avec cet e-mail. Appuie sur « Créer un compte ».",
  "auth/email-already-in-use": "Ce compte existe déjà : appuie sur « Se connecter ».",
  "auth/weak-password": "Mot de passe trop court (6 caractères minimum).",
  "auth/invalid-email": "Cet e-mail n'a pas l'air correct.",
  "auth/network-request-failed": "Pas d'internet ? Réessaie dans un instant.",
  "permission-denied": "Firebase refuse l'accès : vérifie les règles de la base de données.",
  "not-found": "La base de données n'est pas encore créée dans Firebase."
};
const say = e => ERR[e && e.code] || "Oups, ça n'a pas marché 😕" + (e && e.code ? " (" + e.code + ")" : "");

// ----- synchronisation -----
let user = null, ready = false, cloudIds = new Set(), queue = Promise.resolve(), lastErr = "";
const col = () => collection(db, "users", user.uid, "sessions");
const pack = s => { const o = { ...s }; if (o.track) o.track = JSON.stringify(o.track); else delete o.track; return o; };
const unpack = d => { const s = { ...d }; if (typeof s.track === "string") { try { s.track = JSON.parse(s.track); } catch(e){ delete s.track; } } else delete s.track; return s; };

async function push(list){
  const mine = list.filter(s => !s.demo);           // les fausses stats d'exemple restent dans le téléphone
  const ids = new Set(mine.map(s => String(s.id)));
  for (const s of mine) if (!cloudIds.has(String(s.id))) { await setDoc(doc(col(), String(s.id)), pack(s)); cloudIds.add(String(s.id)); }
  for (const id of [...cloudIds]) if (!ids.has(id)) { await deleteDoc(doc(col(), id)); cloudIds.delete(id); }
}
window.upsCloud = list => {
  if (!user || !ready) return;
  queue = queue.then(() => push(list)).then(() => { lastErr = ""; draw(); }).catch(e => { lastErr = say(e); draw(); });
};

async function loadCloud(){
  ready = false; lastErr = ""; draw();
  try {
    const snap = await getDocs(col());
    cloudIds = new Set(snap.docs.map(d => d.id));
    const byId = new Map();
    window.ups.get().forEach(s => byId.set(String(s.id), s));       // ce qu'il y a déjà dans ce téléphone
    snap.docs.forEach(d => byId.set(d.id, unpack(d.data())));        // + ce qu'il y a dans ton compte
    const merged = [...byId.values()].sort((a, b) => a.id - b.id);
    ready = true;
    window.ups.set(merged);
    await push(merged);                                              // envoie les sorties qui n'étaient que dans le téléphone
    setDoc(doc(db, "users", user.uid), { nom: user.displayName || (user.email || "").split("@")[0], vu: new Date().toISOString() }, { merge: true }).catch(()=>{});
  } catch(e){ lastErr = say(e); }
  draw();
}

// ----- affichage -----
// les deux drapeaux à damier : en couleur quand tu es connecté, gris sinon
const FLAGS = on => { const st = on ? "#00e5ff" : "#5f6b8f", fill = on ? "url(#chkB)" : "url(#chkG)";
  return `<svg viewBox="0 0 28 22" aria-hidden="true"><defs><pattern id="chkG" width="4.8" height="4.8" patternUnits="userSpaceOnUse"><rect width="4.8" height="4.8" fill="#9aa3bd"/><rect width="2.4" height="2.4" fill="#4a5578"/><rect x="2.4" y="2.4" width="2.4" height="2.4" fill="#4a5578"/></pattern></defs><g stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 2 Q4.5 .6 1 2.6 L3.2 9.6 Q6.8 7.6 10.4 7.8 Z" fill="${fill}" stroke="${st}" stroke-width="1"/>
    <path d="M20 2 Q23.5 .6 27 2.6 L24.8 9.6 Q21.2 7.6 17.6 7.8 Z" fill="${fill}" stroke="${st}" stroke-width="1"/>
    <path d="M8 2 L16 21 M20 2 L12 21" stroke="${st}" stroke-width="2"/></g></svg>`; };
const flagBox = document.createElement("div"); flagBox.className = "flagbox";
document.querySelector("#v-home .hero").prepend(flagBox);

let mode = "start", formErr = "", menu = 0;   // menu : 0 fermé, 1 choix, 2 « tu es sûr ? »
function drawFlags(){
  const on = !!user;
  let pop = "";
  if (on && menu === 1){
    const name = user.displayName || user.email || "";
    const st = lastErr ? `<p class="err">⚠️ ${esc(lastErr)}</p>` : `<p>☁️ Connecté : <b>${esc(name)}</b><br>${ready ? "Tes sorties sont sauvegardées." : "Je récupère tes sorties…"}</p>`;
    pop = `<div class="pop">${st}<div class="two"><button class="alt" data-a="cancel">Annuler</button><button class="danger" data-a="ask">Se déconnecter</button></div></div>`;
  } else if (on && menu === 2){
    pop = `<div class="pop"><p>Tu es sûr de vouloir te déconnecter ?</p><div class="two"><button class="alt" data-a="cancel">Annuler</button><button class="danger" data-a="out">Oui, me déconnecter</button></div></div>`;
  }
  flagBox.innerHTML = `<button class="flagbtn${on ? " on" : ""}${on && (lastErr || !ready) ? " wait" : ""}${on && lastErr ? " bad" : ""}" aria-label="${on ? "Compte" : "Pas connecté"}">${FLAGS(on)}</button>${pop}`;
  flagBox.querySelector(".flagbtn").onclick = () => {
    if (!on){ box.scrollIntoView({behavior:"smooth", block:"center"}); return; }
    menu = menu ? 0 : 1; drawFlags();
  };
  flagBox.querySelectorAll(".pop button").forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if (a === "cancel") menu = 0; else if (a === "ask") menu = 2; else if (a === "out"){ menu = 0; signOut(auth); }
    drawFlags();
  });
}
flagBox.addEventListener("click", e => e.stopPropagation());
document.addEventListener("click", () => { if (menu){ menu = 0; drawFlags(); } });

function draw(){
  drawFlags();
  if (user){ box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  if (mode === "mail"){
    box.innerHTML = `<p>Connexion avec un e-mail</p>
      <input id="aMail" type="email" autocomplete="email" placeholder="ton e-mail">
      <input id="aPwd" type="password" autocomplete="current-password" placeholder="mot de passe (6 caractères min.)">
      <div class="two"><button id="aIn">Se connecter</button><button class="alt" id="aNew">Créer un compte</button></div>
      <button class="lnk" id="aForgot">Mot de passe oublié ?</button> <button class="lnk" id="aBack">Retour</button>
      ${formErr ? `<p class="err">${esc(formErr)}</p>` : ""}`;
    const v = () => [document.getElementById("aMail").value.trim(), document.getElementById("aPwd").value];
    const go = f => async () => { const [m, p] = v(); formErr = ""; try { await f(auth, m, p); } catch(e){ formErr = say(e); draw(); document.getElementById("aMail").value = m; } };
    document.getElementById("aIn").onclick = go(signInWithEmailAndPassword);
    document.getElementById("aNew").onclick = go(createUserWithEmailAndPassword);
    document.getElementById("aForgot").onclick = async () => { const [m] = v(); if (!m){ formErr = "Écris d'abord ton e-mail."; draw(); return; }
      try { await sendPasswordResetEmail(auth, m); formErr = "C'est envoyé ! Regarde tes e-mails 📬"; } catch(e){ formErr = say(e); } draw(); document.getElementById("aMail").value = m; };
    document.getElementById("aBack").onclick = () => { mode = "start"; formErr = ""; draw(); };
    return;
  }
  box.innerHTML = `<p>☁️ Connecte-toi pour ne jamais perdre tes sorties, même si tu changes de téléphone.</p>
    <button class="g" id="aG"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M45 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.7-2.1 5-4.4 6.6v5.5h7.1C42.6 36.8 45 31.2 45 24.5z"/><path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.4l-7.1-5.5c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9H4.5v5.7C8.1 41.1 15.5 46 24 46z"/><path fill="#FBBC05" d="M11.8 28.2c-.4-1.3-.7-2.7-.7-4.2s.3-2.9.7-4.2v-5.7H4.5C3 17.1 2 20.4 2 24s1 6.9 2.5 9.9l7.3-5.7z"/><path fill="#EA4335" d="M24 10.8c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 4.2 29.9 2 24 2 15.5 2 8.1 6.9 4.5 14.1l7.3 5.7c1.7-5.2 6.5-9 12.2-9z"/></svg>Se connecter avec Google</button>
    <button class="lnk" id="aM">ou avec un e-mail</button>
    ${formErr ? `<p class="err">${esc(formErr)}</p>` : ""}`;
  document.getElementById("aG").onclick = async () => { formErr = ""; try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch(e){ formErr = say(e); draw(); } };
  document.getElementById("aM").onclick = () => { mode = "mail"; formErr = ""; draw(); };
}

box.hidden = true;
onAuthStateChanged(auth, u => {
  user = u; ready = false; cloudIds = new Set(); mode = "start"; formErr = ""; menu = 0;
  if (u) loadCloud(); else draw();
});
</script>
</body>
